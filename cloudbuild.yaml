steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      [
        'build',
        '-t',
        '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:$COMMIT_SHA',
        '.',
      ]

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      [
        'push',
        '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:$COMMIT_SHA',
      ]

  - id: start-test-db
    name: docker/compose:1.29.2
    args: ['-f', 'docker-compose.ci.yml', 'up', '-d', 'db_support_ops_test_ci']

  - id: run-tests
    name: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:$COMMIT_SHA'
    entrypoint: sh
    args:
      - '-c'
      - 'cd /app && npm run test:ci'
    env:
      - 'DATABASE_URL=postgresql://postgres:postgres@db_support_ops_test_ci:5432/support_ops_test_ci?schema=public&connect_timeout=300'
      - 'DIRECT_URL=postgresql://postgres:postgres@db_support_ops_test_ci:5432/support_ops_test_ci?schema=public&connect_timeout=300'
      - 'OPENAI_API_KEY=test-key'
      - 'OPENAI_MODEL=gpt-4.1-mini'
      - 'OPENAI_PROMPT_VERSION=v1'
      - 'PORT=4000'
      - 'NEXT_PUBLIC_API_BASE_URL=http://localhost:4000/api'
    waitFor: ['docker-build', 'docker-push', 'start-test-db']

  - id: stop-test-db
    name: docker/compose:1.29.2
    args: ['-f', 'docker-compose.ci.yml', 'down']
    waitFor: ['run-tests']

  - id: migrate
    name: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:$COMMIT_SHA'
    entrypoint: sh
    args:
      - '-c'
      - 'cd /app && npm run migrate:ci'
    secretEnv: ['DATABASE_URL', 'DIRECT_URL']
    waitFor: ['run-tests']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --port=4000
      - >-
        --set-secrets=
        DATABASE_URL=SUPABASE_URL_SUPPORT_OPS:latest,
        DIRECT_URL=SUPABASE_DIRECT_URL_SUPPORT_OPS:latest,
        OPENAI_API_KEY=OPENAI_API_KEY_SUPPORT_OPS:latest
      - >-
        --update-env-vars=^|||^
        NODE_ENV=production|||
        PROJECT_ENV=staging|||
        PORT=4000|||
        OPENAI_MODEL=gpt-4.1-mini|||
        OPENAI_PROMPT_VERSION=v1|||
        NEXT_PUBLIC_API_BASE_URL=${_SERVICE_URL}/api|||
        CLOUD_RUN_SERVICE_URL=${_SERVICE_URL}
    waitFor: ['migrate']

substitutions:
  _REGION: us-west1
  _REPO: support-ops
  _IMAGE_NAME: support-ops-api
  _SERVICE_NAME: support-ops-api
  _SERVICE_URL: https://support-ops-api-2z5uug5ifq-uw.a.run.app

availableSecrets:
  secretManager:
    - versionName: projects/1026681251800/secrets/SUPABASE_URL_SUPPORT_OPS/versions/latest
      env: DATABASE_URL
    - versionName: projects/1026681251800/secrets/SUPABASE_DIRECT_URL_SUPPORT_OPS/versions/latest
      env: DIRECT_URL

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:$COMMIT_SHA

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
